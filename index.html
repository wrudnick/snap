<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover so the canvas reaches under the notch and the home
      indicator; the touch controls inset themselves with env(safe-area-inset-*).
      user-scalable=no because a pinch is the zoom control, and without this iOS
      zooms the page instead of the lens.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0d10" />
    <!--
      Relative, so it resolves under the Pages base path (/snap/) rather than
      at the domain root, where it would 404.

      `display: fullscreen` is what makes Add to Home Screen launch without any
      browser chrome, which on iPhone is the only way to get fullscreen at all —
      Safari has no Fullscreen API.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <title>snap</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d10;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #e8e6e3;
      }
      /* The canvas owns the pointer during play; UI opts back in explicitly. */
      canvas {
        display: block;
        touch-action: none;
      }
      /* Stops a drag across the viewfinder selecting HUD text on iOS. */
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
